name: Market Scan

on:
  schedule:
    # Weekdays, roughly before / during / after US market (UTC)
    - cron: "30 13 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run short + long scans
        env:
          SCAN_OUT_DIR: frontend/public/data
        run: |
          cd backend
          python - <<'PY'
          from app.services.scanner import run_scan
          short = run_scan("short", force=True)
          long = run_scan("long", force=True)
          print("short", short.get("scanned"), "long", long.get("scanned"))
          PY

      - name: Commit updated scan data
        run: |
          git config user.name "stockIO bot"
          git config user.email "stockio-bot@users.noreply.github.com"
          git add frontend/public/data/scan_short.json frontend/public/data/scan_long.json
          if git diff --staged --quiet; then
            echo "No scan changes"
          else
            git commit -m "chore: refresh market scan data"
            git push
          fi
